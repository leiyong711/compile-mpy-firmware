<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MicroPython 编译队列</title>
    <link rel="stylesheet" href="/static/css/index.min.css">
    <style>
        body { margin: 0; background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
        .page { width: min(1400px, calc(100% - 32px)); margin: 28px auto 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .header h1 { margin: 0; font-size: 28px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .filters .el-input, .filters .el-select { width: 190px; }
        .progress-message { font-size: 12px; color: #606266; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
        .error-log { max-height: 50vh; overflow: auto; white-space: pre-wrap; color: #f56c6c; }
        @media (max-width: 700px) { .header { align-items: flex-start; gap: 12px; flex-direction: column; } }
    </style>
</head>
<body>
<div id="app" class="page">
    <div class="header">
        <h1>编译队列与实时进度</h1>
        <div>
            <el-button size="small" type="success" @click="location.href='/upload'">新建编译任务</el-button>
            <el-button size="small" @click="location.href='/firmware'">已编译固件</el-button>
        </div>
    </div>
    <div class="card">
        <div class="filters">
            <el-input v-model.trim="filters.email" clearable placeholder="邮箱"></el-input>
            <el-select v-model="filters.device_type" placeholder="芯片类型">
                <el-option label="全部芯片" value="all"></el-option>
                <el-option v-for="item in devices" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
            <el-select v-model="filters.flash_size" placeholder="Flash 大小">
                <el-option label="全部容量" value="all"></el-option>
                <el-option v-for="item in allFlashSizes" :key="item" :label="item === 'AUTO' ? '自动/默认' : item" :value="item"></el-option>
            </el-select>
            <el-select v-model="filters.sort">
                <el-option label="任务 ID 升序" value="+id"></el-option>
                <el-option label="任务 ID 降序" value="-id"></el-option>
            </el-select>
            <el-button type="primary" @click="loadTasks">查询</el-button>
        </div>

        <el-table :data="tableData" border empty-text="暂无待编译任务" style="width:100%">
            <el-table-column prop="id" label="任务" width="70"></el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="170"></el-table-column>
            <el-table-column prop="device_type" label="芯片" width="115"></el-table-column>
            <el-table-column prop="board" label="开发板" min-width="185"></el-table-column>
            <el-table-column prop="board_variant" label="变体" width="110">
                <template slot-scope="scope"><span v-text="scope.row.board_variant || '标准版'"></span></template>
            </el-table-column>
            <el-table-column prop="flash_size" label="Flash" width="90"></el-table-column>
            <el-table-column label="实时进度" min-width="260">
                <template slot-scope="scope">
                    <el-progress :percentage="scope.row.progress ? scope.row.progress.percentage : 0"
                                 :status="progressStatus(scope.row)"></el-progress>
                    <div class="progress-message" :title="progressMessage(scope.row)" v-text="progressMessage(scope.row)"></div>
                </template>
            </el-table-column>
            <el-table-column label="状态" width="100">
                <template slot-scope="scope">
                    <el-tag :type="tagType(scope.row.status)" @click="showError(scope.row)" style="cursor:pointer" v-text="statusText(scope.row.status)"></el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="remark" label="备注" min-width="120"></el-table-column>
            <el-table-column prop="update_time" label="更新时间" width="165"></el-table-column>
        </el-table>
        <el-pagination style="margin-top:16px" @size-change="onSize" @current-change="onPage"
                       layout="total, sizes, prev, pager, next" :page-sizes="[5,10,20,50]"
                       :page-size="pageSize" :current-page="currentPage" :total="total"></el-pagination>
    </div>

    <el-dialog title="编译错误" :visible.sync="errorVisible" width="min(760px, 90%)">
        <pre class="error-log" v-text="errorLog"></pre>
    </el-dialog>
</div>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/vue.min.js"></script>
<script src="/static/js/index.min.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        devices: [], tableData: [], total: 0, pageSize: 10, currentPage: 1,
        filters: {email: '', device_type: 'all', flash_size: 'all', sort: '+id'},
        sockets: {}, timer: null, errorVisible: false, errorLog: ''
    },
    computed: {
        allFlashSizes() {
            const values = new Set(); this.devices.forEach(device => device.flash_sizes.forEach(item => values.add(item)));
            return Array.from(values);
        }
    },
    async mounted() {
        await this.loadOptions(); await this.loadTasks();
        this.timer = setInterval(this.loadTasks, 5000);
    },
    beforeDestroy() { clearInterval(this.timer); Object.values(this.sockets).forEach(socket => socket.close()); },
    methods: {
        async loadOptions() {
            try { const response = await axios.get('/api/build-options'); this.devices = response.data.data.devices; }
            catch (error) { this.$message.error('加载编译选项失败：' + error); }
        },
        async loadTasks() {
            try {
                const response = await axios.get('/api/get_firmware_wait_compiled_list', {params: {
                    page: this.currentPage, limit: this.pageSize, email: this.filters.email || null,
                    flash_size: this.filters.flash_size, device_type: this.filters.device_type, sort: this.filters.sort
                }});
                const previous = {}; this.tableData.forEach(row => { if (row.progress) previous[row.id] = row.progress; });
                this.tableData = response.data.data.items.map(row => Object.assign(row, {progress: previous[row.id] || null}));
                this.total = response.data.data.total; this.syncSockets();
            } catch (error) { this.$message.error('获取队列失败：' + error); }
        },
        syncSockets() {
            const activeIds = new Set(this.tableData.filter(row => row.status === 2 || row.status === 3).map(row => String(row.id)));
            Object.keys(this.sockets).forEach(id => { if (!activeIds.has(id)) { this.sockets[id].close(); delete this.sockets[id]; } });
            this.tableData.forEach(row => { if ((row.status === 2 || row.status === 3) && !this.sockets[row.id]) this.connect(row); });
        },
        connect(row) {
            const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socket = new WebSocket(`${scheme}//${location.host}/api/ws/progress/${row.id}`);
            this.sockets[row.id] = socket;
            socket.onmessage = event => {
                const progress = JSON.parse(event.data); this.$set(row, 'progress', progress);
                if (progress.status === 'failed') row.status = 1;
                if (progress.status === 'success') { row.status = 0; setTimeout(this.loadTasks, 1200); }
            };
            socket.onclose = () => { delete this.sockets[row.id]; };
        },
        progressStatus(row) { return row.progress && row.progress.status === 'failed' ? 'exception' : row.progress && row.progress.status === 'success' ? 'success' : undefined; },
        progressMessage(row) { return row.progress ? row.progress.message : (row.status === 3 ? '等待编译' : '正在连接进度服务…'); },
        statusText(status) { return ({0:'编译成功',1:'编译失败',2:'编译中',3:'等待编译'})[status] || '未知'; },
        tagType(status) { return ({0:'success',1:'danger',2:'warning',3:'info'})[status] || 'info'; },
        showError(row) { if (row.err_log) { this.errorLog = row.err_log; this.errorVisible = true; } },
        onSize(value) { this.pageSize = value; this.loadTasks(); },
        onPage(value) { this.currentPage = value; this.loadTasks(); }
    }
});
</script>
</body>
</html>
