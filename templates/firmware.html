<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>已编译 MicroPython 固件</title>
    <link rel="stylesheet" href="/static/css/index.min.css">
    <style>
        body { margin: 0; background: #f5f7fa; font-family: Arial, "Microsoft YaHei", sans-serif; }
        .page { width: min(1450px, calc(100% - 32px)); margin: 28px auto 80px; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
        .header h1 { margin:0; font-size:28px; }
        .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.07); }
        .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
        .filters .el-input, .filters .el-select { width:190px; }
        @media (max-width:700px) { .header { align-items:flex-start; gap:12px; flex-direction:column; } }
    </style>
</head>
<body>
<div id="app" class="page">
    <div class="header">
        <h1>已编译 MicroPython 固件</h1>
        <div>
            <el-button size="small" icon="el-icon-question" @click="location.href='/help/variants'">参数小白教程</el-button>
            <el-button size="small" type="success" @click="location.href='/upload'">新建编译任务</el-button>
            <el-button size="small" @click="location.href='/firmwareWaitCompiled'">编译队列</el-button>
        </div>
    </div>
    <div class="card">
        <div class="filters">
            <el-input v-model.trim="filters.email" clearable placeholder="邮箱"></el-input>
            <el-select v-model="filters.device_type">
                <el-option label="全部芯片" value="all"></el-option>
                <el-option v-for="item in devices" :key="item.value" :label="item.label" :value="item.value"></el-option>
            </el-select>
            <el-select v-model="filters.flash_size">
                <el-option label="全部容量" value="all"></el-option>
                <el-option v-for="item in allFlashSizes" :key="item" :label="item === 'AUTO' ? '自动/默认' : item" :value="item"></el-option>
            </el-select>
            <el-select v-model="filters.sort">
                <el-option label="固件 ID 升序" value="+id"></el-option>
                <el-option label="固件 ID 降序" value="-id"></el-option>
            </el-select>
            <el-button type="primary" @click="loadFirmware">查询</el-button>
        </div>
        <el-table :data="tableData" border empty-text="暂无固件" style="width:100%">
            <el-table-column prop="id" label="ID" width="65"></el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="170"></el-table-column>
            <el-table-column prop="device_type" label="芯片" width="115"></el-table-column>
            <el-table-column prop="board" label="开发板" min-width="180"></el-table-column>
            <el-table-column prop="board_variant" label="变体" width="105">
                <template slot-scope="scope"><span v-text="scope.row.board_variant || '标准版'"></span></template>
            </el-table-column>
            <el-table-column prop="flash_size" label="Flash" width="90"></el-table-column>
            <el-table-column label="编译耗时" width="100">
                <template slot-scope="scope"><span v-text="duration(scope.row.compilation_time_consuming)"></span></template>
            </el-table-column>
            <el-table-column prop="remark" label="备注" min-width="120"></el-table-column>
            <el-table-column prop="start_compilation_time" label="开始编译" width="165"></el-table-column>
            <el-table-column label="下载 / OTA" width="285" fixed="right">
                <template slot-scope="scope">
                    <el-button size="mini" type="primary" @click="download(scope.row, 1)">
                        <span v-text="scope.row.board_variant === 'OTA' ? 'OTA 固件包' : '固件'"></span>
                    </el-button>
                    <el-button size="mini" @click="download(scope.row, 0)">源码</el-button>
                    <el-button v-if="scope.row.board_variant === 'OTA'" size="mini" type="success" @click="showOtaInfo(scope.row)">OTA 信息</el-button>
                </template>
            </el-table-column>
        </el-table>
        <el-pagination style="margin-top:16px" @size-change="onSize" @current-change="onPage"
                       layout="total, sizes, prev, pager, next" :page-sizes="[5,10,20,50]"
                       :page-size="pageSize" :current-page="currentPage" :total="total"></el-pagination>
    </div>

    <el-dialog title="OTA 应用镜像信息" :visible.sync="otaVisible" width="min(760px, 92%)">
        <el-alert type="warning" :closable="false" show-icon
                  title="这里只能写入备用 OTA 应用分区；首次串口烧录仍使用固件包里的 firmware.bin。"></el-alert>
        <p><strong>设备：</strong><span v-text="otaInfo.device_type + ' / ' + otaInfo.board"></span></p>
        <p><strong>文件大小：</strong><span v-text="otaInfo.size"></span> 字节</p>
        <p><strong>SHA-256：</strong></p>
        <el-input readonly :value="otaInfo.sha256"></el-input>
        <p><strong>设备端下载 URL：</strong></p>
        <el-input readonly :value="otaInfo.download_url"></el-input>
        <div slot="footer">
            <el-button @click="location.href='/help/variants'">查看完整 OTA 代码教程</el-button>
            <el-button type="primary" @click="downloadOtaApplication">下载 ota-application.bin</el-button>
        </div>
    </el-dialog>
</div>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/vue.min.js"></script>
<script src="/static/js/index.min.js"></script>
<script>
new Vue({
    el:'#app',
    data:{
        devices:[], tableData:[], total:0, pageSize:10, currentPage:1,
        otaVisible:false, otaInfo:{device_type:'',board:'',size:0,sha256:'',download_url:''},
        filters:{email:'', device_type:'all', flash_size:'all', sort:'-id'}
    },
    computed:{
        allFlashSizes(){ const values=new Set(); this.devices.forEach(d=>d.flash_sizes.forEach(v=>values.add(v))); return Array.from(values); }
    },
    async mounted(){ await this.loadOptions(); await this.loadFirmware(); },
    methods:{
        async loadOptions(){ try{ const r=await axios.get('/api/build-options'); this.devices=r.data.data.devices; }catch(e){ this.$message.error('加载编译选项失败：'+e); } },
        async loadFirmware(){
            try{
                const r=await axios.get('/api/get_firmware_list',{params:{page:this.currentPage,limit:this.pageSize,email:this.filters.email||null,flash_size:this.filters.flash_size,device_type:this.filters.device_type,sort:this.filters.sort}});
                this.tableData=r.data.data.items; this.total=r.data.data.total;
            }catch(e){ this.$message.error('获取固件列表失败：'+e); }
        },
        duration(ms){ const seconds=Math.round((ms||0)/1000); return seconds<60 ? seconds+' 秒' : Math.floor(seconds/60)+'分'+(seconds%60)+'秒'; },
        async download(row,fileType){
            let password='';
            if(row.retrieve_password){
                try{ const result=await this.$prompt('请输入提取密码','下载验证',{inputType:'password',confirmButtonText:'下载',cancelButtonText:'取消'}); password=result.value; }
                catch(e){ return; }
            }
            try{
                const response=await axios.get('/api/download',{params:{firmware_id:row.id,retrieve_password:password,file_type:fileType},responseType:'arraybuffer'});
                const disposition=response.headers['content-disposition']||'';
                const match=disposition.match(/filename="?([^";]+)"?/i); const name=match?match[1]:(fileType===1?'firmware.bin':'source.zip');
                const url=URL.createObjectURL(new Blob([response.data])); const link=document.createElement('a'); link.href=url; link.download=name;
                document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
            }catch(e){
                let message='下载失败';
                if(e.response&&e.response.data){ try{ message=JSON.parse(new TextDecoder().decode(e.response.data)).message||message; }catch(ignore){} }
                this.$message.error(message);
            }
        },
        async showOtaInfo(row){
            let password='';
            if(row.retrieve_password){
                try{ const result=await this.$prompt('请输入提取密码以读取 OTA 信息','OTA 验证',{inputType:'password',confirmButtonText:'确定',cancelButtonText:'取消'}); password=result.value; }
                catch(e){ return; }
            }
            try{
                const response=await axios.get(`/api/ota/${row.id}/manifest`,{params:{retrieve_password:password||null}});
                const info=response.data.data;
                const query=password ? `?retrieve_password=${encodeURIComponent(password)}` : '';
                this.otaInfo=Object.assign({},info,{download_url:location.origin+info.download_path+query});
                this.otaVisible=true;
            }catch(e){ this.$message.error((e.response&&e.response.data&&e.response.data.message)||'获取 OTA 信息失败'); }
        },
        downloadOtaApplication(){ if(this.otaInfo.download_url) location.href=this.otaInfo.download_url; },
        onSize(value){this.pageSize=value;this.loadFirmware();}, onPage(value){this.currentPage=value;this.loadFirmware();}
    }
});
</script>
</body>
</html>
